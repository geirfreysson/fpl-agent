name: FPL Data Update

on:
  schedule:
    # Run at midnight UTC daily
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-fpl-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Install dependencies
      run: uv sync

    - name: Run FPL data collector
      run: uv run python fpl_data/fpl_data_collector.py

    - name: Process FPL data
      run: uv run python fpl_data/process_fpl_data.py

    - name: Check for changes
      id: check_changes
      run: |
        git add fpl_data/fpl_data/*.parquet
        if git diff --cached --quiet; then
          echo "changes=false" >> $GITHUB_OUTPUT
        else
          echo "changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push changes
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git commit -m "Update FPL data - $(date +'%Y-%m-%d %H:%M UTC')"
        git pull --rebase origin ${{ github.ref_name }}
        git push